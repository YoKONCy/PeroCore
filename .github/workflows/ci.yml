# CI 流水线 — PeroCore-TS
# 触发规则: push 到 main/dev 或 PR 到 main
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  # 允许其他 workflow (如 release.yml) 复用本流水线
  workflow_call:

# 同一 PR 只保留最新一次运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── 阶段 1: 代码规范检查 ──
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Prettier
        run: pnpm format:check

  # ── 阶段 2: 单元测试 ──
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test:run

      - name: Coverage Report
        run: pnpm test:coverage
        continue-on-error: true

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false # 如果网络不好上传失败了，不影响整体构建
          verbose: true

  # ── 阶段 3: 类型检查 + 构建验证 ──
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 版本号同步
        run: pnpm version:sync

      - name: 全包构建
        run: pnpm build
