# 发布流水线 — PeroCore
# 触发: 推送任意 tag
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  # ── 1. 质量门禁 (复用 CI) ──
  ci:
    name: Quality Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ── 2. Electron 标准版 (NSIS 安装包) ──
  build-standard:
    name: Build Standard (Windows)
    runs-on: windows-latest
    needs: ci
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_CACHE: ${{ github.workspace }}\\.electron-cache
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-${{ runner.os }}-40.2.1

      - run: pnpm install --frozen-lockfile

      - name: 版本号同步
        run: pnpm version:sync

      - name: 构建前端 + 后端 + Electron
        run: pnpm build

      - name: 构建 Electron 标准版 (NSIS)
        run: pnpm exec electron-builder --config electron-builder.standard.yml --publish never
        env:
          PEROCORE_EDITION: standard

      # 验证: 确认标准版不含 Steam 组件
      - name: 验证 Steam 组件已排除
        shell: powershell
        run: |
          $UNPACKED = "release-electron/win-unpacked"
          $steamFiles = Get-ChildItem $UNPACKED -Recurse -Include "steam_api64.dll","steamworksjs.*.node","steam_appid.txt" -ErrorAction SilentlyContinue
          if ($steamFiles.Count -gt 0) {
            Write-Error "Steam components found in standard build. Build rejected."
            $steamFiles | ForEach-Object { Write-Error "  -> $($_.FullName)" }
            exit 1
          }
          Write-Host "Standard build Steam component check passed"

      - uses: actions/upload-artifact@v7
        with:
          name: electron-standard
          path: release-electron/*.exe

  # ── 3. Electron 便携版 (ZIP 解压即用) ──
  build-portable:
    name: Build Portable (Windows)
    runs-on: windows-latest
    needs: ci
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_CACHE: ${{ github.workspace }}\\.electron-cache
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-${{ runner.os }}-40.2.1

      - run: pnpm install --frozen-lockfile

      - name: 版本号同步
        run: pnpm version:sync

      - name: 构建前端 + 后端
        run: pnpm build

      - name: 构建 Electron 便携版
        run: pnpm exec electron-builder --config electron-builder.portable.yml --publish never
        env:
          PEROCORE_EDITION: standard

      # 验证: 确认便携版不含 Steam 组件
      - name: 验证 Steam 组件已排除
        shell: powershell
        run: |
          $portableZip = Get-ChildItem "release-electron" -Filter "*Portable*.zip" | Select-Object -First 1
          if ($portableZip) {
            Write-Host "Portable artifact found: $($portableZip.Name)"
          } else {
            Write-Error "Portable artifact not found"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: electron-portable
          path: release-electron/*Portable*.zip

  # ── 4. Electron Steam 版 (仅限 release 分支或手动触发) ──
  build-steam:
    name: Build Steam (Windows)
    runs-on: windows-latest
    needs: ci
    env:
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_CACHE: ${{ github.workspace }}\\.electron-cache
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: ${{ env.ELECTRON_CACHE }}
          key: electron-${{ runner.os }}-40.2.1

      - run: pnpm install --frozen-lockfile

      - name: 版本号同步
        run: pnpm version:sync

      - name: 构建前端 + 后端 + Electron
        run: pnpm build

      - name: 构建 Electron Steam 版
        run: pnpm exec electron-builder --config electron-builder.steam.yml
        env:
          PEROCORE_EDITION: steam

      # 验证: 确认 Steam 版包含必要的 Steam 组件
      - name: 验证 Steam 组件已包含
        shell: powershell
        run: |
          $UNPACKED = "release-electron/win-unpacked"
          $dll = Test-Path "$UNPACKED/steam_api64.dll"
          $appid = Test-Path "$UNPACKED/steam_appid.txt"
          if (!$dll -or !$appid) {
            Write-Error "Steam build is missing required components (steam_api64.dll / steam_appid.txt)"
            exit 1
          }
          Write-Host "Steam build component check passed"

      - uses: actions/upload-artifact@v7
        with:
          name: electron-steam
          path: release-electron/win-unpacked/**/*

  # ── 5. Docker 镜像构建 ──
  build-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: ci
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - name: 提取版本号
        id: meta
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: 构建后端镜像
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/perocore-backend:latest
            ${{ env.DOCKERHUB_USERNAME }}/perocore-backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建前端镜像
        if: env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != ''
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/perocore-frontend:latest
            ${{ env.DOCKERHUB_USERNAME }}/perocore-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 6. GitHub Release ──
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-standard, build-portable, build-steam, build-docker]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: electron-standard
          path: release-assets/

      - uses: actions/download-artifact@v4
        with:
          name: electron-portable
          path: release-assets/

      # Steam 版不上传到 GitHub Release（通过 SteamPipe 发布）

      - name: 生成 Changelog
        id: changelog
        run: |
          # 从最近两个 tag 之间提取 commit 信息
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-decorate)
          else
            COMMITS=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD")
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 生成发布元数据
        id: release_meta
        run: echo "build_time=$(date '+%Y-%m-%dT%H:%M:%S%z')" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          name: '萌动链接：PeroperoChat！ ${{ github.ref_name }}'
          body: |
            ## 🎉 ${{ github.ref_name }} 版本更新

            萌动链接：PeroperoChat！是一款开源的 AI 桌面伴侣应用，集成本地大模型、3D 桌宠、Plugin 系统与多智能体框架。

            ---

            ### 📦 下载说明

            | 文件 | 说明 | 推荐人群 |
            |------|------|----------|
            | `*-Setup-*.exe` | 安装版 | 普通用户，数据存储在系统用户目录 |
            | `*-Portable*.zip` | 便携版（解压即用） | 随身携带或多设备使用，数据存储于程序目录 |

            > ⚠️ Windows 可能弹出 SmartScreen 警告，点击“仍要运行”即可。本软件为开源项目，源码可在仓库中查阅。
            > 🎮 Steam 用户请直接通过 Steam 客户端获取更新。

            ---

            ### 🆕 本版本更新内容

            #### ✨ 新特性

            请查阅本次 Commit 记录了解具体变更。

            #### 🐛 问题修复

            请查阅本次 Commit 记录了解具体变更。

            #### 🏗️ 架构优化

            请查阅本次 Commit 记录了解具体变更。

            ---

            ### 📝 Commit 记录

            ${{ steps.changelog.outputs.commits }}

            ---

            ### 🚀 快速开始

            1. 下载并安装（安装版）或直接运行（便携版）。
            2. 首次启动后在设置中配置 LLM API Key。
            3. 如需 Docker 部署，可拉取对应版本镜像。
            4. 详细使用文档请参阅项目 Wiki。

            ---

            ### 🐳 Docker 用户

            ```bash
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/perocore-backend:${{ github.ref_name }}
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/perocore-frontend:${{ github.ref_name }}
            ```

            ---

            *由 GitHub Actions 自动构建发布 · 构建时间：${{ steps.release_meta.outputs.build_time }}*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
