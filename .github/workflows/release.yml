# 发布流水线 — infOS
# 触发: 推送任意 tag
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  # ── 1. 质量门禁 (复用 CI) ──
  ci:
    name: Quality Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ── 2. Electron 标准版 (NSIS 安装包) ──
  build-standard:
    name: Build Standard (Windows)
    runs-on: windows-2022
    needs: ci
    env:
      npm_config_msvs_version: 2022
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_CACHE: ${{ github.workspace }}\\.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\\.electron-builder-cache
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-${{ runner.os }}-40.2.1-26.8.1

      - run: pnpm install --frozen-lockfile

      - name: 初始化 Visual Studio C++ 构建环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 版本号同步
        run: pnpm version:sync

      - name: 构建前端 + 后端 + Electron
        run: pnpm build

      - name: 构建官方应用发行资源
        run: pnpm build:official-apps

      - name: 准备内置 Daemon 运行时
        run: node scripts/build-daemon-bundle.mjs && node scripts/collect-daemon-deps.mjs && pnpm rebuild:daemon-deps

      - name: 构建 Electron 标准版 (NSIS)
        shell: powershell
        run: |
          $attempt = 1
          while ($attempt -le 2) {
            pnpm exec electron-builder --config electron-builder.standard.yml --publish never
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq 2) {
              exit $LASTEXITCODE
            }
            Write-Warning "Electron Builder 首次失败，清理产物后重试（用于恢复 rcedit 文件锁定）"
            Start-Sleep -Seconds 5
            Remove-Item "release-electron" -Recurse -Force -ErrorAction SilentlyContinue
            $attempt += 1
          }
        env:
          INFOS_EDITION: standard

      # 验证: 确认标准版不含 Steam 组件
      - name: 验证 Steam 组件已排除
        shell: powershell
        run: |
          $UNPACKED = "release-electron/win-unpacked"
          $steamFiles = Get-ChildItem $UNPACKED -Recurse -Include "steam_api64.dll","steamworksjs.*.node","steam_appid.txt" -ErrorAction SilentlyContinue
          if ($steamFiles.Count -gt 0) {
            Write-Error "Steam components found in standard build. Build rejected."
            $steamFiles | ForEach-Object { Write-Error "  -> $($_.FullName)" }
            exit 1
          }
          Write-Host "Standard build Steam component check passed"

      - uses: actions/upload-artifact@v7
        with:
          name: electron-standard
          path: release-electron/*.exe

  # ── 3. Electron 便携版 (ZIP 解压即用) ──
  build-portable:
    name: Build Portable (Windows)
    runs-on: windows-2022
    needs: ci
    env:
      npm_config_msvs_version: 2022
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_CACHE: ${{ github.workspace }}\\.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\\.electron-builder-cache
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-${{ runner.os }}-40.2.1-26.8.1

      - run: pnpm install --frozen-lockfile

      - name: 初始化 Visual Studio C++ 构建环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 版本号同步
        run: pnpm version:sync

      - name: 构建前端 + 后端
        run: pnpm build

      - name: 构建官方应用发行资源
        run: pnpm build:official-apps

      - name: 准备内置 Daemon 运行时
        run: node scripts/build-daemon-bundle.mjs && node scripts/collect-daemon-deps.mjs && pnpm rebuild:daemon-deps

      - name: 构建 Electron 便携版
        run: pnpm exec electron-builder --config electron-builder.portable.yml --publish never
        env:
          INFOS_EDITION: portable

      # 验证: 确认便携版不含 Steam 组件
      - name: 验证 Steam 组件已排除
        shell: powershell
        run: |
          $portableZip = Get-ChildItem "release-electron" -Filter "*Portable*.zip" | Select-Object -First 1
          if ($portableZip) {
            Write-Host "Portable artifact found: $($portableZip.Name)"
          } else {
            Write-Error "Portable artifact not found"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: electron-portable
          path: release-electron/*Portable*.zip

  # Standard 安装包只做构建期产物检查；NSIS GUI 安装在无桌面 CI 中可能永久等待，
  # 不再将无人值守安装烟测作为发布门禁。
  accept-portable:
    name: Accept Portable Archive
    runs-on: windows-2022
    needs: build-portable
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/validate-release-artifact.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: electron-portable
          path: acceptance-artifacts/portable

      - name: 解压并启动最终 Portable ZIP
        run: node scripts/validate-release-artifact.mjs portable acceptance-artifacts/portable acceptance-evidence/portable

      - name: 上传 Portable 验收现场
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-portable-evidence
          path: acceptance-evidence/portable
          if-no-files-found: warn

  # ── 5. Electron Steam 版 ──
  build-steam:
    name: Build Steam (Windows)
    runs-on: windows-2022
    needs: ci
    env:
      npm_config_msvs_version: 2022
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_CACHE: ${{ github.workspace }}\\.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\\.electron-builder-cache
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-${{ runner.os }}-40.2.1-26.8.1

      - run: pnpm install --frozen-lockfile

      - name: 初始化 Visual Studio C++ 构建环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 版本号同步
        run: pnpm version:sync

      - name: 构建前端 + 后端 + Electron
        run: pnpm build

      - name: 构建官方应用发行资源
        run: pnpm build:official-apps

      - name: 准备内置 Daemon 运行时
        run: node scripts/build-daemon-bundle.mjs && node scripts/collect-daemon-deps.mjs && pnpm rebuild:daemon-deps

      - name: 构建 Electron Steam 版
        run: pnpm exec electron-builder --config electron-builder.steam.yml
        env:
          INFOS_EDITION: steam

      # 验证: 确认 Steam 版包含必要的 Steam 组件
      - name: 验证 Steam 组件已包含
        shell: powershell
        run: |
          $UNPACKED = "release-electron/win-unpacked"
          $dll = Test-Path "$UNPACKED/steam_api64.dll"
          $appid = Test-Path "$UNPACKED/steam_appid.txt"
          if (!$dll -or !$appid) {
            Write-Error "Steam build is missing required components (steam_api64.dll / steam_appid.txt)"
            exit 1
          }
          Write-Host "Steam build component check passed"

      - uses: actions/upload-artifact@v7
        with:
          name: electron-steam
          path: release-electron/win-unpacked/**/*

  # ── 6. Docker 镜像构建 ──
  build-docker:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v6

      - name: 提取镜像元数据
        id: meta
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布后端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/infos-backend:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/infos-backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并发布前端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/infos-frontend:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/infos-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 7. GitHub Release ──
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-standard, accept-portable, build-steam, build-docker]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: electron-standard
          path: release-assets/

      - uses: actions/download-artifact@v4
        with:
          name: electron-portable
          path: release-assets/

      - name: 生成 Docker Compose 一键部署包
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/__INFOS_VERSION__/${VERSION}/g" docker-compose.release.yml > release-assets/docker-compose.yml

      # Steam 版不上传到 GitHub Release（通过 SteamPipe 发布）

      - name: 生成 Changelog
        id: changelog
        run: |
          # 从最近两个 tag 之间提取 commit 信息
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-decorate)
          else
            COMMITS=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD")
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 生成发布元数据
        id: release_meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME,,}"
          echo "build_time=$(date '+%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc* || "$TAG" == *-alpha* || "$TAG" == *-beta* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: '萌动链接：PeroperoChat！ ${{ github.ref_name }}'
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          make_latest: ${{ steps.release_meta.outputs.prerelease != 'true' }}
          files: release-assets/*
          overwrite_files: true
          body: |
            ## 🎉 ${{ github.ref_name }} 版本更新

            萌动链接：PeroperoChat！是一款开源的 AI 桌面伴侣应用，集成本地大模型、3D 桌宠、Plugin 系统与多智能体框架。

            ---

            ### 📦 下载说明

            | 文件 | 说明 | 推荐人群 |
            |------|------|----------|
            | `*-Setup-*.exe` | 安装版 | 普通用户，数据存储在系统用户目录 |
            | `*-Portable*.zip` | 便携版（解压即用） | 随身携带或多设备使用，数据存储于程序目录 |

            > ⚠️ Windows 可能弹出 SmartScreen 警告，点击“仍要运行”即可。本软件为开源项目，源码可在仓库中查阅。
            > 🎮 Steam 用户请直接通过 Steam 客户端获取更新。

            ---

            ### 🆕 本版本更新内容

            #### ✨ 新特性

            - 新增“知识库”前端工作台：在核心记忆下提供事实库与文档知识库双入口，支持事实对象目录、全文搜索、有效事实详情、来源与置信度按需展开、历史取代链查看，以及文档知识库建设状态展示。
            - 新增完整的多 Server 手动全量同步能力：以来源服务器为唯一真值，提供加密完整快照、同步前备份、重启边界原子替换、失败回滚、撤销上次同步与 Steam Cloud 完整快照语义。
            - 新增远程能力节点 Shell：能力节点可主动出站连接 Home Server，Agent 可通过二级展开的远程终端工具包管理 AutoDL、Linux、GPU、ComfyUI 与长时训练任务。
            - 新增 Browser、Computer Use 与 Remote Terminal 高级工具包的统一二级展开机制，减少默认工具上下文占用，并保持一次 ReAct 生命周期内稳定可用。
            - 完善聊天图片附件体验：图片上传上限提升至 20MB，消息图片以气泡外轻量便签卡片展示，并支持应用内原图预览。
            - 完善核心记忆档案浏览、图谱与事实库的共享数据契约，为记忆、事实和外部知识建立清晰分层。

            #### 🐛 问题修复

            - 修复 Electron 多 Renderer 竞争 Input Seat 导致续租过期的问题；仅由聚焦窗口持有和续租 Seat，并在过期或身份不匹配时自动恢复。
            - 修复透明 Pet 窗口可能遗漏 `ready-to-show` 并被误判超时的问题，改由首帧与页面加载事件共同判定窗口就绪。
            - 修复 YSM Molang 控制器中单个第三方脚本失败会拖垮整组模型加载的问题，改为逐文件获取和逐脚本容错。
            - 修复模型 API Key 持久化、Token 统计、附件边界校验、图片重复渲染和 Electron 外链预览等交互问题。
            - 清理全仓 ESLint 与 Prettier 错误，并以零 warning 标准通过检查；同时修复空 `catch`、无效正则转义、未使用变量和类型契约问题。

            #### 🏗️ 架构优化

            - 收敛 P9 分布式语义为面向普通用户的“从此服务器上同步最新数据”，移除自动多主同步、对象级选择与双向合并复杂度；Electron、Steam 与便携版业务入口保持本机 Daemon 绑定。
            - 重构 Capability Node、Provider Runtime、Capability Offer、Invocation 与 Receipt 链路，加入 Pairing Code、持久设备 Token、自动重连、心跳和长时 Shell Session。
            - 将事实库建设为 SQLite 与 TriviumDB 协同的共享事实层，支持对象、别名、有效事实、显式取代、幂等操作重放和只读档案 API。
            - 优化 Conversation Surface、内部 Surface Protocol、任务中心、审批、输入请求、远程工具审批和多节点 Gateway 的边界契约。
            - 完善版本同步脚本：移除不存在的浏览器扩展硬指向，补齐 Arca、Avatar Assets、Document Engine、Node SDK、Node Host、分布式服务与 Arca Host 版本覆盖。

            > 以下 Commit 记录包含从上一版本到当前版本的完整提交摘要；上方内容为面向用户的重点归纳。

            ---

            ### 📝 Commit 记录

            ${{ steps.changelog.outputs.commits }}

            ---

            ### 🚀 快速开始

            1. 下载并安装（安装版）或直接运行（便携版）。
            2. 首次启动后在设置中配置 LLM API Key。
            3. 如需 Docker 部署，可拉取对应版本镜像。
            4. 详细使用文档请参阅项目 Wiki。

            ---

            ### 🐳 Docker 用户

            下载 Release 附件中的 `docker-compose.yml`，即可使用本版本固定镜像一键启动：

            ```bash
            curl -LO https://github.com/YoKONCy/infOS/releases/download/${{ github.ref_name }}/docker-compose.yml
            docker compose up -d
            ```

            启动后访问 `http://localhost:3000`。如需更新当前版本镜像，可执行：

            ```bash
            docker compose pull
            docker compose up -d
            ```

            ---

            *由 GitHub Actions 自动构建发布 · 构建时间：${{ steps.release_meta.outputs.build_time }}*
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
