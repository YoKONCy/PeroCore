# 发布流水线 — infOS
# 触发: 推送任意 tag
name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  # ── 1. 质量门禁 (复用 CI) ──
  ci:
    name: Quality Gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # ── 2. Electron 标准版 (NSIS 安装包) ──
  build-standard:
    name: Build Standard (Windows)
    runs-on: windows-2022
    needs: ci
    env:
      npm_config_msvs_version: 2022
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_CACHE: ${{ github.workspace }}\\.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\\.electron-builder-cache
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-${{ runner.os }}-40.2.1-26.8.1

      - run: pnpm install --frozen-lockfile

      - name: 初始化 Visual Studio C++ 构建环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 版本号同步
        run: pnpm version:sync

      - name: 构建前端 + 后端 + Electron
        run: pnpm build

      - name: 构建官方应用发行资源
        run: pnpm build:official-apps

      - name: 准备内置 Daemon 运行时
        run: node scripts/build-daemon-bundle.mjs && node scripts/collect-daemon-deps.mjs && pnpm rebuild:daemon-deps

      - name: 构建 Electron 标准版 (NSIS)
        shell: powershell
        run: |
          $attempt = 1
          while ($attempt -le 2) {
            pnpm exec electron-builder --config electron-builder.standard.yml --publish never
            if ($LASTEXITCODE -eq 0) {
              exit 0
            }
            if ($attempt -eq 2) {
              exit $LASTEXITCODE
            }
            Write-Warning "Electron Builder 首次失败，清理产物后重试（用于恢复 rcedit 文件锁定）"
            Start-Sleep -Seconds 5
            Remove-Item "release-electron" -Recurse -Force -ErrorAction SilentlyContinue
            $attempt += 1
          }
        env:
          INFOS_EDITION: standard

      # 验证: 确认标准版不含 Steam 组件
      - name: 验证 Steam 组件已排除
        shell: powershell
        run: |
          $UNPACKED = "release-electron/win-unpacked"
          $steamFiles = Get-ChildItem $UNPACKED -Recurse -Include "steam_api64.dll","steamworksjs.*.node","steam_appid.txt" -ErrorAction SilentlyContinue
          if ($steamFiles.Count -gt 0) {
            Write-Error "Steam components found in standard build. Build rejected."
            $steamFiles | ForEach-Object { Write-Error "  -> $($_.FullName)" }
            exit 1
          }
          Write-Host "Standard build Steam component check passed"

      - uses: actions/upload-artifact@v7
        with:
          name: electron-standard
          path: release-electron/*.exe

  # ── 3. Electron 便携版 (ZIP 解压即用) ──
  build-portable:
    name: Build Portable (Windows)
    runs-on: windows-2022
    needs: ci
    env:
      npm_config_msvs_version: 2022
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_CACHE: ${{ github.workspace }}\\.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\\.electron-builder-cache
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-${{ runner.os }}-40.2.1-26.8.1

      - run: pnpm install --frozen-lockfile

      - name: 初始化 Visual Studio C++ 构建环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 版本号同步
        run: pnpm version:sync

      - name: 构建前端 + 后端
        run: pnpm build

      - name: 构建官方应用发行资源
        run: pnpm build:official-apps

      - name: 准备内置 Daemon 运行时
        run: node scripts/build-daemon-bundle.mjs && node scripts/collect-daemon-deps.mjs && pnpm rebuild:daemon-deps

      - name: 构建 Electron 便携版
        run: pnpm exec electron-builder --config electron-builder.portable.yml --publish never
        env:
          INFOS_EDITION: portable

      # 验证: 确认便携版不含 Steam 组件
      - name: 验证 Steam 组件已排除
        shell: powershell
        run: |
          $portableZip = Get-ChildItem "release-electron" -Filter "*Portable*.zip" | Select-Object -First 1
          if ($portableZip) {
            Write-Host "Portable artifact found: $($portableZip.Name)"
          } else {
            Write-Error "Portable artifact not found"
            exit 1
          }

      - uses: actions/upload-artifact@v7
        with:
          name: electron-portable
          path: release-electron/*Portable*.zip

  # Standard 安装包只做构建期产物检查；NSIS GUI 安装在无桌面 CI 中可能永久等待，
  # 不再将无人值守安装烟测作为发布门禁。
  accept-portable:
    name: Accept Portable Archive
    runs-on: windows-2022
    needs: build-portable
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout: scripts/validate-release-artifact.mjs
          sparse-checkout-cone-mode: false

      - uses: actions/download-artifact@v4
        with:
          name: electron-portable
          path: acceptance-artifacts/portable

      - name: 解压并启动最终 Portable ZIP
        run: node scripts/validate-release-artifact.mjs portable acceptance-artifacts/portable acceptance-evidence/portable

      - name: 上传 Portable 验收现场
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: acceptance-portable-evidence
          path: acceptance-evidence/portable
          if-no-files-found: warn

  # ── 5. Electron Steam 版 ──
  build-steam:
    name: Build Steam (Windows)
    runs-on: windows-2022
    needs: ci
    env:
      npm_config_msvs_version: 2022
      ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/
      ELECTRON_CACHE: ${{ github.workspace }}\\.electron-cache
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}\\.electron-builder-cache
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.ELECTRON_CACHE }}
            ${{ env.ELECTRON_BUILDER_CACHE }}
          key: electron-builder-${{ runner.os }}-40.2.1-26.8.1

      - run: pnpm install --frozen-lockfile

      - name: 初始化 Visual Studio C++ 构建环境
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: 版本号同步
        run: pnpm version:sync

      - name: 构建前端 + 后端 + Electron
        run: pnpm build

      - name: 构建官方应用发行资源
        run: pnpm build:official-apps

      - name: 准备内置 Daemon 运行时
        run: node scripts/build-daemon-bundle.mjs && node scripts/collect-daemon-deps.mjs && pnpm rebuild:daemon-deps

      - name: 构建 Electron Steam 版
        run: pnpm exec electron-builder --config electron-builder.steam.yml
        env:
          INFOS_EDITION: steam

      # 验证: 确认 Steam 版包含必要的 Steam 组件
      - name: 验证 Steam 组件已包含
        shell: powershell
        run: |
          $UNPACKED = "release-electron/win-unpacked"
          $dll = Test-Path "$UNPACKED/steam_api64.dll"
          $appid = Test-Path "$UNPACKED/steam_appid.txt"
          if (!$dll -or !$appid) {
            Write-Error "Steam build is missing required components (steam_api64.dll / steam_appid.txt)"
            exit 1
          }
          Write-Host "Steam build component check passed"

      - uses: actions/upload-artifact@v7
        with:
          name: electron-steam
          path: release-electron/win-unpacked/**/*

  # ── 6. Docker 镜像构建 ──
  build-docker:
    name: Build and Publish Docker Images
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@v6

      - name: 提取镜像元数据
        id: meta
        shell: bash
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          OWNER=$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "owner=$OWNER" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布后端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/infos-backend:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/infos-backend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 构建并发布前端镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile.frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/infos-frontend:latest
            ${{ env.REGISTRY }}/${{ steps.meta.outputs.owner }}/infos-frontend:${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 7. GitHub Release ──
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-standard, accept-portable, build-steam, build-docker]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: electron-standard
          path: release-assets/

      - uses: actions/download-artifact@v4
        with:
          name: electron-portable
          path: release-assets/

      - name: 生成 Docker Compose 一键部署包
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed "s/__INFOS_VERSION__/${VERSION}/g" docker-compose.release.yml > release-assets/docker-compose.yml

      # Steam 版不上传到 GitHub Release（通过 SteamPipe 发布）

      - name: 生成 Changelog
        id: changelog
        run: |
          # 从最近两个 tag 之间提取 commit 信息
          PREV_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-decorate)
          else
            COMMITS=$(git log --oneline --no-decorate "${PREV_TAG}..HEAD")
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: 生成发布元数据
        id: release_meta
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME,,}"
          echo "build_time=$(date '+%Y-%m-%dT%H:%M:%S%z')" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-rc* || "$TAG" == *-alpha* || "$TAG" == *-beta* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: '萌动链接：PeroperoChat！ ${{ github.ref_name }}'
          prerelease: ${{ steps.release_meta.outputs.prerelease }}
          make_latest: ${{ steps.release_meta.outputs.prerelease != 'true' }}
          files: release-assets/*
          overwrite_files: true
          body: |
            ## 🎉 ${{ github.ref_name }} 版本更新

            萌动链接：PeroperoChat！是一款开源的 AI 桌面伴侣应用，集成本地大模型、3D 桌宠、Plugin 系统与多智能体框架。

            ---

            ### 📦 下载说明

            | 文件 | 说明 | 推荐人群 |
            |------|------|----------|
            | `*-Setup-*.exe` | 安装版 | 普通用户，数据存储在系统用户目录 |
            | `*-Portable*.zip` | 便携版（解压即用） | 随身携带或多设备使用，数据存储于程序目录 |

            > ⚠️ Windows 可能弹出 SmartScreen 警告，点击“仍要运行”即可。本软件为开源项目，源码可在仓库中查阅。
            > 🎮 Steam 用户请直接通过 Steam 客户端获取更新。

            ---

            ### 🆕 本版本更新内容

            #### ✨ 新特性与体验完善

            - 新增知识库前端工作台与核心记忆档案增强：支持事实检索、来源检查、事实撤回、核心记忆归档，以及保留 TriviumDB 图节点和关系边的安全删除语义。
            - 新增“朗读此消息”能力，统一桌面开发版与发行版的音频输出节点身份和 TTS 投递链路。
            - 对话历史改为首屏 60 轮、稳定游标分页和顶部加载锚定；加入富文本 LRU、消息 revision 复用、Mermaid 动态加载及不可见嵌入内容卸载。
            - 工作上下文改为结构化来源存储，同一文件、网页或浏览器实例始终保留最新内容，并按配置轮次和模型 Token 窗口自动淘汰最旧内容。
            - NapCat 在进程存活期间持续幂等同步所有 QQ 账号的 infOS 反向 WebSocket 配置，支持登录新账号、切换账号及配置被 NapCat 重写后的自动恢复。
            - 深浅色切换图标补齐太阳与月亮图形，分布式入口使用独立图标，提升导航辨识度。

            #### 🐛 问题修复

            - 恢复普通对话的后台 Scorer 消费链路：连续未覆盖对话达到阈值后自动提炼核心记忆；上下文窗口大兜底会批量处理全部未覆盖轮次，不再被单条 Coverage 阻断。
            - 修复大文件编辑工具参数流造成的 O(n²) Surface 帧膨胀、前端缺少“正在编辑”状态以及后续流式回复积压到 ReAct 结束才显示的问题。
            - 修复 `read_file` 与 `read_file_range` 在工具内部按 800 行读取后又被统一 8000 字符二次截断的问题，确保合法读取窗口完整进入当前 ReAct。
            - 修复 RAG/Embedding 进度被消息 `v-memo` 缓存挡住的问题，恢复“正在生成记忆检索向量”等实时过程提示；核心记忆页会在对话完成后自动刷新。
            - 修复内部历史标签中的精确时间被模型复述到前端的问题：新上下文不再注入秒级时间，旧格式泄漏由精确规则清理，同时保持正常 HTML 渲染。
            - 修复连续 HTML 块被空行错误拆分、知识库 Tab 未定义 VNode、核心记忆与知识库旧数据字段缺失、对话 Tab 切换空白及不稳定窗口化引发的滚动回弹问题。
            - 修复长记忆第 N+1 轮兜底语义、Token 预算 Agent 归属与缺失窗口元数据、发行版 TTS 输出节点不可用等问题。

            #### 🏗️ 架构与性能重构

            - 重构 Conversation Surface 工具参数流：正文预览限制为 2048 字符，后续仅发送轻量进度边界；持久化审计只保存路径、哈希、范围和规模，不保存读取正文。
            - 重构自动工作上下文为带 `sourceKey` 的版本化结构，支持同轮与跨轮最新值去重，并兼容既有纯文本记录。
            - 完善 Event Memory Coverage、后台提炼日志、核心记忆/事实归档契约和软删除状态，使事件、事实与关系图保持一致。
            - 优化 Projection 与 Compositor：稳定消息游标、Surface 合并快照、工具结果索引、对象身份复用及流式 Markdown 分段共同降低长对话渲染开销。
            - 撤回会改变消息估算高度的动态窗口化和 `content-visibility` 方案，优先保证长回复滚动、到底行为与侧栏切换稳定。
            - 强化 NapCat OneBot 配置同步的多账号幂等性、字段校准、变更检测与 IPC 向后兼容。

            > 以下 Commit 记录包含从上一版本到当前版本的完整提交摘要；上方内容为面向用户的重点归纳。

            ---

            ### 📝 Commit 记录

            ${{ steps.changelog.outputs.commits }}

            ---

            ### 🚀 快速开始

            1. 下载并安装（安装版）或直接运行（便携版）。
            2. 首次启动后在设置中配置 LLM API Key。
            3. 如需 Docker 部署，可拉取对应版本镜像。
            4. 详细使用文档请参阅项目 Wiki。

            ---

            ### 🐳 Docker 用户

            下载 Release 附件中的 `docker-compose.yml`，即可使用本版本固定镜像一键启动：

            ```bash
            curl -LO https://github.com/YoKONCy/infOS/releases/download/${{ github.ref_name }}/docker-compose.yml
            docker compose up -d
            ```

            启动后访问 `http://localhost:3000`。如需更新当前版本镜像，可执行：

            ```bash
            docker compose pull
            docker compose up -d
            ```

            ---

            *由 GitHub Actions 自动构建发布 · 构建时间：${{ steps.release_meta.outputs.build_time }}*
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
