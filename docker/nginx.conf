# ===================================================================
# Nginx 配置 (前端 Docker 容器用)
#
# 职责:
# 1. 提供 Vue SPA 静态文件
# 2. 反向代理 /api/* 和 /ws/* 到后端容器
# 3. 支持 SPA History 路由回退
#
# @see _docs_/07_DUAL_DEPLOYMENT.md §3.2
# ===================================================================

server {
    listen       80;
    server_name  localhost;

    # ── 静态文件 (Vue SPA) ──
    root   /usr/share/nginx/html;
    index  index.html;

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1024;

    # SPA History 模式 — 所有前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API 反向代理 → 后端容器 ──
    # 端口 9120 对齐 D32 (HTTP + WS 同端口)
    location /api/ {
        proxy_pass http://backend:9120;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持 (chat/stream)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ── WebSocket 反向代理 → Gateway ──
    location /ws/ {
        proxy_pass http://backend:9120;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;  # 24 小时，长连接
    }

    # 静态资源缓存策略
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
