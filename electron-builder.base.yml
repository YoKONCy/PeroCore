# electron-builder 基础配置
# 所有构建变体共享此基础配置
# ⚠️ Steam 组件严格过滤：base 配置默认排除所有 Steam 相关文件
#    仅 electron-builder.steam.yml 会覆写此规则
appId: com.infos.peroperochat
productName: '萌动链接：PeroperoChat！'
copyright: Copyright © 2024-2026 YoKONCy and infOS Contributors

electronVersion: 40.2.1

extraMetadata:
  main: main/index.js
  dependencies:
    electron-updater: 6.8.3
  optionalDependencies: {}

directories:
  output: release-electron

# Electron 主进程 + 前端构建产物
files:
  - from: .
    to: .
    filter:
      - package.json
  - from: node_modules/electron-updater
    to: node_modules/electron-updater
    filter:
      - '**/*'
  - from: node_modules/builder-util-runtime
    to: node_modules/builder-util-runtime
    filter:
      - '**/*'
  - from: node_modules/fs-extra
    to: node_modules/fs-extra
    filter:
      - '**/*'
  - from: node_modules/js-yaml
    to: node_modules/js-yaml
    filter:
      - '**/*'
  - from: node_modules/lazy-val
    to: node_modules/lazy-val
    filter:
      - '**/*'
  - from: node_modules/lodash.escaperegexp
    to: node_modules/lodash.escaperegexp
    filter:
      - '**/*'
  - from: node_modules/lodash.isequal
    to: node_modules/lodash.isequal
    filter:
      - '**/*'
  - from: node_modules/semver
    to: node_modules/semver
    filter:
      - '**/*'
  - from: node_modules/tiny-typed-emitter
    to: node_modules/tiny-typed-emitter
    filter:
      - '**/*'
  - from: node_modules/graceful-fs
    to: node_modules/graceful-fs
    filter:
      - '**/*'
  - from: node_modules/jsonfile
    to: node_modules/jsonfile
    filter:
      - '**/*'
  - from: node_modules/universalify
    to: node_modules/universalify
    filter:
      - '**/*'
  - from: node_modules/debug
    to: node_modules/debug
    filter:
      - '**/*'
  - from: node_modules/ms
    to: node_modules/ms
    filter:
      - '**/*'
  - from: node_modules/sax
    to: node_modules/sax
    filter:
      - '**/*'
  - from: node_modules/argparse
    to: node_modules/argparse
    filter:
      - '**/*'
  - from: dist-electron/main
    to: main
    filter:
      - '**/*'
  - from: dist-electron/preload
    to: preload
    filter:
      - '**/*'
  - from: dist/renderer
    to: renderer
    filter:
      - '**/*'

# 原生模块解包 (避免 asar 内的 .node 加载失败)
asar: true
asarUnpack:
  - '**/*.node'
  - '**/*.dll'
  - '**/*.wasm'

# 后端构建产物 + 运行时资源
extraResources:
  - from: packages/native/render-core-runtime
    to: native
    filter:
      - '**/*'
  - from: packages/backend/dist
    to: backend
    filter:
      - '**/*'
  - from: packages/backend/src/services/mdp/prompts
    to: backend/backend/src/services/mdp/prompts
    filter:
      - '**/*'
  - from: packages/backend/src/assets/agents
    to: backend/backend/src/assets/agents
    filter:
      - '**/*'
  - from: packages/backend/src/tools
    to: backend/backend/src/tools
    filter:
      - '**/manifest.json'
  - from: packages/backend/src/assets
    to: backend/backend/src/assets
    filter:
      - '**/*'
  - from: public/Logo.png
    to: Logo.png
  # ── 便携模式自包含运行时（方案 A：exe 自动拉起内置 Daemon）──
  # daemon 单文件 bundle（由 scripts/build-daemon-bundle.mjs 产出）
  - from: dist-daemon/daemon.mjs
    to: daemon/daemon.mjs
  # daemon 运行所需生产依赖（由 scripts/collect-daemon-deps.mjs 产出）
  - from: dist-daemon/node_modules
    to: node_modules
    filter:
      - '**/*'
  # 当前构建平台/架构的内置 ripgrep，由依赖收集脚本生成。
  - from: dist-daemon/bin
    to: bin
    filter:
      - '**/*'
  # 内置社交应用资源（prompts / tools manifest / app.manifest）+ 编译产物
  - from: packages/apps/social
    to: backend/apps/social
    filter:
      - '**/*'
  - from: dist-daemon/social-runtime.mjs
    to: backend/apps/social/runtime/index.js
  # 首次启动建表所需的 SQL 迁移（tsc 不复制 .sql）
  - from: packages/backend/src/database/migrations
    to: backend/backend/src/database/migrations
    filter:
      - '*.sql'

# 不使用 npm rebuild (pnpm workspace 已经处理好原生模块)
npmRebuild: false

afterPack: scripts/electron-after-pack.cjs

# 发布到 GitHub Releases (electron-updater 拉取更新)
publish:
  - provider: github
    owner: YoKONCy
    repo: infOS

# Windows 通用配置
win:
  icon: public/Logo.png

# NSIS 安装包配置
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: '${productName}-Setup-${version}.${ext}'
  shortcutName: '萌动链接：PeroperoChat！'
  uninstallDisplayName: '萌动链接：PeroperoChat！'
