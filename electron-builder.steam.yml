# Steam 版构建配置
# 包含 Steam SDK 文件 + steamworks.js 原生模块
# ⚠️ 这是唯一允许包含 Steam 组件的构建变体
extends: electron-builder.base.yml

extraMetadata:
  main: main/index.js
  dependencies:
    steamworks.js: 0.4.0
  optionalDependencies: {}

# 覆写 files: 包含 Steam 组件
files:
  - from: .
    to: .
    filter:
      - package.json
  - from: dist-electron/main
    to: main
    filter:
      - '**/*'
  - from: dist-electron/preload
    to: preload
    filter:
      - '**/*'
  - from: dist/renderer
    to: renderer
    filter:
      - '**/*'
  - from: node_modules/steamworks.js
    to: node_modules/steamworks.js
    filter:
      - '**/*'
  - from: resources/steam
    to: resources/steam
    filter:
      - '**/*'

asarUnpack:
  - '**/*.node'
  - '**/*.dll'
  - '**/*.wasm'
  - node_modules/steamworks.js/**/*

# Steam SDK 文件放到应用根目录（.exe 同级）
extraFiles:
  - from: node_modules/steamworks.js/dist/win64/steam_api64.dll
    to: .
  - from: resources/steam/steam_appid.txt
    to: .

# Steam 版不需要 electron-updater，由 Steam 自带更新
publish: null

win:
  icon: public/Logo.png
  target:
    - nsis
    - dir
