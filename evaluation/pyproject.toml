[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "infos-eval"
version = "0.1.0"
description = "infOS 与 TriviumDB 的可复现评测框架"
requires-python = ">=3.11,<3.13"
dependencies = []

[project.optional-dependencies]
triviumdb = ["triviumdb==0.8.2"]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.9",
]

[project.scripts]
infos-eval = "infos_eval.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/infos_eval"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
