# Nana Agent 能力矩阵
# tools中的“*”表示角色层不做减法，最终能力仍受Channel、运行环境、模型和Thread策略约束。
agent: nana

channels:
  desktop:
    tools:
      - '*'
    skills:
      - '*'
    prompt_fragments:
      - components/abilities/workspace

  work:
    tools:
      - '*'
    skills:
      - code_assistance
    prompt_fragments:
      - components/abilities/workspace

  group:
    tools:
      - '*'
    skills: []
    prompt_fragments: []
