---
name: group
description: 群聊/据点模式 — 保留默认人设，注入据点环境和互动规则
---
# ── 100: 人设不变 (v1 group.md 使用相同的 system_core + persona_definition) ──

# ── 禁用桌面专属槽位 ──
# v1 group.md 没有 draft_flow/pet_state/user_persona/knowledge/sensory abilities
# 注：150_cot_guidance slot 已删除（内容合并到 components/output/output_constraint.md）
- id: "250_draft_flow"
  enabled: false
- id: "500_knowledge"
  enabled: false
- id: "800_pet_state"
  enabled: false
- id: "900_user_persona"
  enabled: false

# ── 200: 工具能力由 FC tools 参数原生注入 ──
# ── 300: 工具定义保留 (v1 group.md footer 有 available_tools_desc) ──
# ── 400: 规则保留 (v1 group.md footer 有 output_constraint) ──

# ── 600: 注入据点环境 ──
# v1: environment_display.md → 渲染为 stronghold_environment
# v1: 直接注入 current_room_state
- id: "600_mode_patch"
  enabled: true
  userOverride: |
    <Stronghold_Context>
    {{ stronghold_environment }}
    </Stronghold_Context>

    <Room_State>
    {{ current_room_state }}
    </Room_State>

# ── 700: 记忆 + 桌面历史 + 群聊历史 (v1 group.md 包含全部三个) ──
- id: "700_memory_context"
  enabled: true
  userOverride: |
    <Long_Term_Memory>
    {{ memory_context }}
    </Long_Term_Memory>

    <Desktop_History>
    {{ flattened_desktop_history }}
    </Desktop_History>

    <Group_History>
    {{ flattened_group_history }}
    </Group_History>

# ── 9500: footer 替换为互动规则 ──
# 工具调用由 FC 原生能力提供，复杂编排可通过 run_script 工具实现
- id: "9500_footer"
  enabled: true
  userOverride: |
    <Interaction_Rules>
    {{ available_tools_desc }}

    {{ group_interaction_rules }}

    {{ output_constraint }}
    </Interaction_Rules>
