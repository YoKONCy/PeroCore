---
name: lightweight
description: 轻量模式 — 几乎等同桌面模式，但禁用思维链，footer 添加轻量限制
---
# ── 100: 人设不变 (v1 lightweight.md 与 system.md 相同) ──

# ── 禁用思维链相关 ──
# v1 lightweight 没有 COT/draft_flow
- id: "150_cot_guidance"
  enabled: false
- id: "250_draft_flow"
  enabled: false

# ── 200: 工具能力由 FC tools 参数原生注入 ──
# ── 300: 工具保留 ──
# ── 400: 规则保留 ──
# ── 500: knowledge 保留 (v1 lightweight 有 graph_context) ──
# ── 700: 记忆保留 ──
# ── 800: pet_state 保留 (v1 lightweight 有 mood/vibe/mind/vision_status) ──
# ── 900: user_persona 保留 (v1 lightweight 有 owner_name + user_persona) ──

# ── 9500: footer 追加轻量限制 ──
# v1 lightweight footer = 桌面 footer + 额外的轻量模式指令
- id: "9500_footer"
  enabled: true
  userOverride: |
    <Instruction_Context>
    {{ ability_sensory }}

    {{ ability }}

    {{ output_constraint }}

    [重要指令]
    当前处于轻量响应模式。

    1. 请跳过复杂的思考过程 (Thinking)，直接输出回复。
    2. 如需操作，请直接使用工具。
    3. 仅关注视觉与任务管理。
    4. **单轮限制**: 最多只能调用一次工具。收到工具结果后，必须立即给出最终回复。
    </Instruction_Context>
