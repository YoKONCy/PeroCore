[package]
name = "nit-runtime"
version = "0.9.1"
edition = "2021"
description = "PeroCore Rust N-API: minGRU inference/training + Leiden clustering"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
# N-API 绑定
napi = { version = "2", features = ["napi8"] }
napi-derive = "2"

# 随机数 (Xavier 初始化)
rand = "0.8"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
